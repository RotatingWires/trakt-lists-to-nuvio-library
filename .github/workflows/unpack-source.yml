name: Finish Trakt to Nuvio source import

on:
  push:
    branches: [main]
    paths:
      - trakt-lists-to-nuvio-source.zip
      - .github/workflows/unpack-source.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace source ZIP with browsable Python source
        shell: bash
        run: |
          set -euo pipefail
          unzip -t trakt-lists-to-nuvio-source.zip
          rm -rf /tmp/trakt-source
          mkdir -p /tmp/trakt-source
          unzip -q trakt-lists-to-nuvio-source.zip -d /tmp/trakt-source
          src="$(find /tmp/trakt-source -type f -name 'trakt_lists_to_nuvio.py' -print -quit)"
          test -n "$src"
          cp "$src" ./trakt_lists_to_nuvio.py
          python3 -m py_compile trakt_lists_to_nuvio.py
          rm -f trakt-lists-to-nuvio-source.zip
          rm -f .github/workflows/unpack-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add browsable Trakt to Nuvio importer source" -m "Replace the source ZIP with the normal trakt_lists_to_nuvio.py file." -m "Verify the importer compiles successfully before committing and remove the one-time transfer workflow."
          git push
